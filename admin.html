<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bader Wallstudio Admin</title>
<link rel="icon" href="icon-192.png">
<style>[hidden]{display:none!important}
:root{--bg:#f5f3ee;--card:#fff;--fg:#22211f;--mut:#6f6a62;--line:#e3dfd6;--acc:#a8875a;--accfg:#fff;--accs:#f3ebdf;--side:#1f2124;--sidefg:#e9e5dc;--sidemut:#9a958b;--ok:#2f7d4f;--oks:#e3f1e8;--off:#8a857c;--offs:#ecebe7;--warn:#a5552b;--warns:#f7e7de;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222427;--fg:#eeebe4;--mut:#a39e94;--line:#34363a;--acc:#c5a77a;--accfg:#1c1a16;--accs:#3a3327;--side:#101112;--sidefg:#e9e5dc;--sidemut:#8d887e;--ok:#7cc79a;--oks:#22382b;--off:#9a958b;--offs:#2e3033;--warn:#e39a74;--warns:#40291f;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222427;--fg:#eeebe4;--mut:#a39e94;--line:#34363a;--acc:#c5a77a;--accfg:#1c1a16;--accs:#3a3327;--side:#101112;--sidefg:#e9e5dc;--sidemut:#8d887e;--ok:#7cc79a;--oks:#22382b;--off:#9a958b;--offs:#2e3033;--warn:#e39a74;--warns:#40291f;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidefg);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.hexlogo{width:30px;height:34px;background:var(--acc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.brand b{font-size:15px;letter-spacing:.06em;display:block}.brand small{color:var(--sidemut);font-size:12px}
.nav{background:none;border:0;color:var(--sidefg);text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;white-space:nowrap}
.nav i{width:8px;height:9px;background:var(--sidemut);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.nav:hover{background:rgba(255,255,255,.06)}
.nav[aria-current="page"]{background:rgba(197,167,122,.18);color:#fff;font-weight:600}.nav[aria-current="page"] i{background:#c5a77a}
.navsep{color:var(--sidemut);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:14px 10px 4px}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--warns);color:var(--warn);border-radius:10px;padding:9px 14px;font-size:13.5px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-size:24px;margin:0;text-wrap:balance}.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
h2{font-size:15px;margin:0 0 10px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}.btn.danger{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);min-width:0}
.stat b{font-size:28px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.quick{display:flex;flex-direction:column;gap:8px}.quick .btn{text-align:left}
.tblw{overflow-x:auto;margin:0 -16px -16px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 16px;font-weight:600}
td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--accs)}
.hx{width:38px;height:44px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#b9b2a6 center/cover;display:block;flex:none}
.nm{display:flex;align-items:center;gap:12px}.nm small{display:block;color:var(--mut)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--oks);color:var(--ok);white-space:nowrap}
.pill.off{background:var(--offs);color:var(--off)}.pill.warn{background:var(--warns);color:var(--warn)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.media figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.media .im{aspect-ratio:1;background:#b9b2a6 center/cover}.media figcaption{padding:8px 10px;font-size:12.5px;color:var(--mut)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--card);width:min(460px,100%);height:100%;overflow:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.dlg{margin:auto;background:var(--card);border-radius:14px;padding:22px;max-width:380px;width:calc(100% - 32px);display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--fg);width:100%}
input[type=range]{accent-color:var(--acc);padding:0!important;border:0!important;background:none!important}
.rowb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.drawer>*{flex:none}.prev{height:150px;border-radius:12px;background:#b9b2a6 center/cover;border:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.menu{display:none}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:15;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}.side.open{transform:none}.menu{display:inline-flex}.two{grid-template-columns:minmax(0,1fr)}}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--side)}
.lbox{background:var(--card);border-radius:16px;padding:26px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.lbox .brand{padding:0;color:var(--fg)}.lbox .brand small{color:var(--mut)}
.err{color:var(--warn);font-size:14px;min-height:20px}
.note{background:var(--accs);border-radius:10px;padding:10px 14px;font-size:13.5px}
.newbox{background:var(--accs);border:1px solid var(--acc);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.newbox pre{margin:0;white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;user-select:all}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
td .btn.sm{margin:2px 4px 2px 0}
</style></head><body>
<div class="login" id="login" hidden><form class="lbox" id="lform" autocomplete="on">
 <div class="brand"><i class="hexlogo"></i><div><b>BADER WALLSTUDIO</b><small>Admin</small></div></div>
 <label class="f">Code<input id="lcode" autocomplete="username" autocapitalize="characters" placeholder="WS-0000"></label>
 <label class="f">PIN<input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="6 Ziffern"></label>
 <div class="err" id="lerr"></div>
 <button class="btn pri" id="lgo" type="submit">Anmelden</button>
 <a href="./" style="color:var(--mut);font-size:13px;text-align:center">Zurück zum Wallstudio</a>
</form></div>
<div class="app" id="app" hidden>
<nav class="side" id="side"></nav>
<main class="main"><div class="wrap" id="view"></div></main>
</div>

async function loadContent(){try{const r=await rpc('ws_content_list',{p_token:ses.token});if(!r||!r.ok)throw 0;srvOk=true;const srv=r.items.filter(i=>i.kind==='technik');
  for(const it of srv){const old=cust.find(t=>t.id===it.id);if(old&&old.upd===it.updated_at)continue;const g=await rpc('ws_content_get',{p_token:ses.token,p_id:it.id});if(!g||!g.ok||!g.img)continue;const T=Object.assign({},it.data||{},{id:it.id,img:g.img,on:it.active!==false,ord:it.ord||0,upd:it.updated_at,pub:true});if(old)cust=cust.map(t=>t.id===it.id?T:t);else cust.push(T)}

 techniken(){return '<div class="top"><div><button class="btn sm menu" id="menu">Menü</button><h1>Spachteltechniken</h1><p class="sub">Eigene Techniken aus Originalbildern anlegen</p></div><button class="btn pri" id="tnew">Neue Technik</button></div>'+
  '<div class="note">'+(srvOk?'Veröffentlichte Techniken erscheinen bei allen angemeldeten Kunden beim nächsten Start des Wallstudios.':srvOk===false?'Die zentrale Verteilung ist noch nicht eingerichtet (Supabase-Skript Phase 4 fehlt oder keine Verbindung). Techniken werden vorerst nur auf diesem Gerät gespeichert.':'Verbindung wird geprüft …')+'</div>'+
  '<div class="card"><h2>Eigene Techniken</h2>'+(cust.length?tbl(['Technik','Kategorie','Status',''],cust.map(t=>'<tr><td><div class="nm"><i class="hx" style="background-image:url('+t.img+')"></i><div>'+esc(t.name)+'<small>eigenes Foto</small></div></div></td><td>'+esc(t.cat||'')+'</td><td>'+pill(t.on!==false)+' '+(t.pub?'<span class="pill">Veröffentlicht</span>':'<span class="pill warn">Nur dieses Gerät</span>')+'</td><td><button class="btn sm" data-tedit="'+esc(t.id)+'">Bearbeiten</button>'+(t.pub?'':'<button class="btn sm" data-tpub="'+esc(t.id)+'">Veröffentlichen</button>')+'<a class="btn sm" style="text-decoration:none;display:inline-block" href="./?tech=c:'+esc(t.id)+'">Im Wallstudio ansehen</a></td></tr>')):'<p class="sub">Noch keine eigene Technik. Mit «Neue Technik» lädst du ein Foto deiner Musterplatte hoch.</p>')+'</div>'+
  '<div class="card"><h2>Eingebaute Techniken</h2>'+tbl(['Technik','Kategorie','Status'],B.techniken.map(r=>'<tr><td><div class="nm">'+hx(r[0])+'<div>'+r[1]+'<small>eingebaut</small></div></div></td><td>'+r[2]+'</td><td>'+pill(1)+'</td></tr>'))+'</div>'},
 boden(){return head('Bodenmaterialien','Eingebaute Böden in Wallstudio 1.0.3')+later('Phase 5')+'<div class="card">'+tbl(['Boden','Kategorie','Status'],B.boden.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+pill(1)+'</td></tr>'))+'</div>'},
 wand(){return head('Wandmaterialien','Materialgruppen für die Spachteltechniken')+later('Phase 4')+'<div class="card"><p class="sub">Noch keine Materialgruppen angelegt. Heute wählt der Kunde direkt eine Spachteltechnik.</p></div>'},
 raeume(){return head('Räume','Raumliste und Einrichtung in Wallstudio 1.0.3')+later('Phase 7')+'<div class="card">'+tbl(['Raum','Einrichtung zur Auswahl','Status'],B.raeume.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+pill(1)+'</td></tr>'))+'</div>'},
 farben(){return head('Farben und Oberflächen','Farbtöne im Wallstudio')+later('Phase 4')+'<div class="card"><p class="sub">Heute: feste Farbliste, eigener Farbton und NCS-Farbkarte direkt im Wallstudio.</p></div>'},
 medien(){return head('Bilder und Texturen','Zentrale Medienverwaltung')+later('Phase 6')+'<div class="card"><p class="sub">Noch keine hochgeladenen Bilder. Die Strukturen der eingebauten Techniken sind fest im Programm.</p></div>'},
 vorschlaege(){return head('Gestaltungsvorschläge','Fertige Kombinationen als Startpunkt für Kunden')+later('Phase 7')+'<div class="card"><p class="sub">Noch keine Gestaltungsvorschläge angelegt.</p></div>'},
 projekte(){return head('Kundenprojekte','Gespeicherte Gestaltungen deiner Kunden')+later('Phase 8')+'<div class="card"><p class="sub">Projekte liegen heute nur auf dem Gerät des Kunden und sind hier noch nicht sichtbar.</p></div>'},
 einstellungen(){return head('Einstellungen','Markenauftritt und allgemeine Angaben')+later('Phase 8')+'<div class="card"><p class="sub">Angemeldet als '+esc(ses.name)+'. Abmelden meldet dich auf diesem Gerät auch im Wallstudio ab.</p></div>'},
 benutzer(){let h=head('Benutzer und Lizenzen','Zugänge anlegen, sperren, neue PIN vergeben und entfernen');
  h+='<div class="card"><h2>Neuen Zugang anlegen</h2><div class="addrow"><input id="uname" placeholder="Name der Person oder Firma" maxlength="60"><button class="btn pri" id="uadd">Zugang anlegen</button></div></div>'+newBox;
  if(!users)return h+'<div class="card"><p class="sub">'+(usersErr?esc(usersErr)+' <button class="btn sm" id="ureload">Neu laden</button>':'Lädt …')+'</p></div>';
  return h+'<div class="card">'+tbl(['Name','Code','Rolle','Lizenz','Letzte Anmeldung',''],users.map(u=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.code)+'</td><td>'+(u.admin?'Administrator':'Kunde')+'</td><td>'+pill(u.active,'Aktiv','Gesperrt')+'</td><td>'+fmt(u.last_login)+'</td><td>'+
   (u.admin?'':'<button class="btn sm" data-act="toggle" data-id="'+esc(u.id)+'">'+(u.active?'Sperren':'Entsperren')+'</button>')+'<button class="btn sm" data-act="pin" data-id="'+esc(u.id)+'">Neue PIN</button>'+(u.admin?'':'<button class="btn sm danger" data-act="rm" data-id="'+esc(u.id)+'">Entfernen</button>')+'</td></tr>'))+'</div>'}
};
function tEdit(id){const o=id?cust.find(t=>t.id===id):null;const T=o?Object.assign({},o):{id:'',name:'',desc:'',cat:'Effekt',img:'',color:'',cm:60,str:50,gloss:40,grain:40,relief:40,metal:0,on:true};
 const rg=(k,l)=>'<label class="f">'+l+' <input type="range" min="0" max="100" data-k="'+k+'" value="'+(T[k]==null?50:T[k])+'"></label>';
 $('#layer').innerHTML='<div class="ov" id="ov"><div class="drawer"><h1 style="font-size:20px">'+(o?esc(o.name)+' bearbeiten':'Neue Spachteltechnik')+'</h1>'+
 '<div class="prev" id="tprev" style="background-image:url('+T.img+')"></div>'+
 '<label class="f">Originalbild (frontal, gleichmässiges Licht, möglichst gross)<input type="file" id="tfile" accept="image/*"></label>'+
 '<label class="f">Name<input id="tname" maxlength="60" value="'+esc(T.name)+'" placeholder="z. B. Kupfer gewischt"></label>'+
 '<label class="f">Beschreibung<textarea id="tdesc" rows="2" maxlength="300" placeholder="Kurze Beschreibung für Kunden">'+esc(T.desc)+'</textarea></label>'+
 '<label class="f">Kategorie<select id="tcat">'+CATS.map(c=>'<option'+(c===T.cat?' selected':'')+'>'+c+'</option>').join('')+'</select></label>'+
 '<label class="f">Bildbreite in Wirklichkeit (cm)<input type="number" id="tcm" min="10" max="300" value="'+T.cm+'"></label>'+
 '<label class="f">Farbton der Technik (Kunden können ihn im Wallstudio ändern)<input type="color" id="tcol" value="'+(/^#[0-9a-f]{6}$/i.test(T.color||'')?T.color:'#c8b89c')+'" style="height:44px;padding:4px"></label>'+rg('str','Zeichnung (wie stark die Spachtelzüge sichtbar sind)')+rg('gloss','Glanzgrad')+rg('metal','Metallglanz')+rg('grain','Körnung')+rg('relief','Relief (Höhen und Vertiefungen)')+
 '<label class="sw"><input type="checkbox" id="ton" '+(T.on!==false?'checked':'')+'> Aktiv – im Wallstudio sichtbar</label>'+
 '<div class="rowb">'+(o?'<button class="btn danger" id="tdel">Löschen</button>':'')+'<button class="btn" id="cancel">Abbrechen</button><button class="btn pri" id="tsave">Speichern</button></div></div></div>';
 const close=()=>$('#layer').innerHTML='';$('#cancel').onclick=close;
 $('#tfile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const S=512,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),m=Math.min(im.naturalWidth,im.naturalHeight);x.imageSmoothingQuality='high';x.drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,S,S);
   const d=x.getImageData(0,0,S,S).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/16,h=v=>('0'+Math.round(v/n).toString(16)).slice(-2);T.color='#'+h(r)+h(g)+h(b);T.img=c.toDataURL('image/jpeg',.82);$('#tcol').value=T.color;$('#tprev').style.backgroundImage='url('+T.img+')'};im.onerror=()=>toast('Dieses Bild kann nicht gelesen werden.');im.src=rd.result};rd.readAsDataURL(f)};
 $('#tsave').onclick=()=>{T.name=$('#tname').value.trim();T.desc=$('#tdesc').value.trim();T.cat=$('#tcat').value;T.cm=Math.max(10,Math.min(300,+$('#tcm').value||60));T.on=$('#ton').checked;T.color=$('#tcol').value;document.querySelectorAll('.drawer input[data-k]').forEach(i=>T[i.dataset.k]=+i.value);
  if(!T.name){toast('Bitte einen Namen eingeben.');return}if(!T.img){toast('Bitte ein Originalbild hochladen.');return}
  const old=cust.slice();if(o)cust=cust.map(t=>t.id===o.id?T:t);else{T.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);T.ord=cust.length+1;cust.push(T)}
  if(!saveCust()){cust=old;return}close();go('techniken');toast('Wird gespeichert …');pushT(T).then(ok=>{go('techniken');toast(ok?'Gespeichert und veröffentlicht':'Gespeichert – nur auf diesem Gerät')})};
 if(o)$('#tdel').onclick=()=>ask('«'+o.name+'» wirklich löschen?','Löschen',async()=>{if(o.pub){const r=await act('ws_content_delete',{p_id:o.id});if(!r)return}cust=cust.filter(t=>t.id!==o.id);saveCust();go('techniken');toast('Gelöscht')})}
let cur='dashboard';
function go(v){if(!V[v])v='dashboard';cur=v;$('#view').innerHTML=V[v]();$('#side').classList.remove('open');document.querySelectorAll('.nav[data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'page':'false'));try{if(location.hash.slice(1)!==v)location.hash=v}catch(e){}}
async function loadUsers(){usersErr='';try{const r=await rpc('ws_list',{p_token:ses.token});if(!r||!r.ok){if(r&&/admin/i.test(r.error||'')){denied('Dieser Zugang hat keine Admin-Rechte.');return}throw new Error((r&&r.error)||'Fehler')}users=r.users||[]}catch(e){users=null;usersErr='Liste konnte nicht geladen werden: '+e.message}go(cur)}
async function act(fn,args){try{const r=await rpc(fn,Object.assign({p_token:ses.token},args));if(!r||!r.ok){toast((r&&r.error)||'Fehler');return null}return r}catch(e){toast('Keine Verbindung zum Server.');return null}}
function showNew(name,code,pin,isNew){const url=location.origin+location.pathname.replace(/admin\.html$/,'');const txt='Zugang zum Bader Wallstudio\n'+url+'\nCode: '+code+'\nPIN: '+pin;
 newBox='<div class="newbox"><b>'+(isNew?'Neuer Zugang für ':'Neue PIN für ')+esc(name)+'</b><pre id="newtxt">'+esc(txt)+'</pre><div><button class="btn sm" id="copy">Text kopieren</button></div><span class="sub">Die PIN siehst du nur jetzt. Schick sie der Person, zum Beispiel per WhatsApp.</span></div>'}
function ask(q,yes,fn){$('#layer').innerHTML='<div class="ov" id="ov"><div class="dlg"><b>'+esc(q)+'</b><span class="sub">Das lässt sich nicht rückgängig machen.</span><div class="rowb"><button class="btn" id="cancel">Abbrechen</button><button class="btn danger" id="yes">'+yes+'</button></div></div></div>';$('#cancel').onclick=()=>$('#layer').innerHTML='';$('#yes').onclick=()=>{$('#layer').innerHTML='';fn()}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-v],[data-go],[data-act],[data-tedit],[data-tpub],#tnew,#menu,#uadd,#copy,#ureload,#logout');if(!t)return;
 if(t.id==='tnew'){tEdit(null);return}if(t.dataset.tpub){const T=cust.find(x=>x.id===t.dataset.tpub);if(T){t.disabled=true;const ok=await pushT(T);go('techniken');toast(ok?'Veröffentlicht':'Noch nicht möglich – Supabase-Skript Phase 4 fehlt oder keine Verbindung')}return}if(t.dataset.tedit){tEdit(t.dataset.tedit);return}
 if(t.id==='menu')$('#side').classList.toggle('open');
 else if(t.id==='logout'){try{await rpc('ws_logout',{p_token:ses.token})}catch(x){}ses=null;save();users=null;newBox='';showLogin('')}
 else if(t.id==='ureload')loadUsers();
 else if(t.id==='copy'){const txt=$('#newtxt').textContent;try{await navigator.clipboard.writeText(txt);toast('Kopiert')}catch(x){const r=document.createRange();r.selectNodeContents($('#newtxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text markiert – jetzt kopieren')}}
 else if(t.id==='uadd'){const nm=$('#uname').value.trim();if(!nm){toast('Bitte einen Namen eingeben.');return}t.disabled=true;const r=await act('ws_add',{p_name:nm});if(r&&r.code){showNew(nm,r.code,r.pin,true);await loadUsers()}else t.disabled=false}
 else if(t.dataset.act){const u=(users||[]).find(x=>String(x.id)===t.dataset.id);if(!u)return;
  if(t.dataset.act==='toggle'){const r=await act('ws_set_active',{p_id:u.id,p_active:!u.active});if(r){toast(u.name+(u.active?' gesperrt':' entsperrt'));loadUsers()}}
  else if(t.dataset.act==='pin'){const r=await act('ws_new_pin',{p_id:u.id});if(r&&r.pin){showNew(u.name,u.code,r.pin,false);go('benutzer');window.scrollTo(0,0)}}
  else if(t.dataset.act==='rm')ask('«'+u.name+'» wirklich entfernen?','Entfernen',async()=>{const r=await act('ws_remove',{p_id:u.id});if(r){toast(u.name+' entfernt');loadUsers()}})}
 else if(t.dataset.v){go(t.dataset.v);window.scrollTo(0,0)}else if(t.dataset.go){go(t.dataset.go);window.scrollTo(0,0)}});
window.addEventListener('hashchange',()=>{if(ses&&!$('#app').hidden)go(location.hash.slice(1))});
function showLogin(msg){$('#app').hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg||''}
function denied(msg){ses=null;showLogin(msg)}
function enter(){$('#login').hidden=true;$('#app').hidden=false;
 $('#side').innerHTML='<div class="brand"><i class="hexlogo"></i><div><b>BADER WALLSTUDIO</b><small>Admin</small></div></div>'+NAV.map((n,i)=>(i===1?'<div class="navsep">Inhalte</div>':i===7?'<div class="navsep">Kunden</div>':i===9?'<div class="navsep">System</div>':'')+'<button class="nav" data-v="'+n[0]+'"><i></i>'+n[1]+'</button>').join('')+'<div style="flex:1"></div><a class="nav" href="./" style="text-decoration:none;font-weight:600"><i style="background:#c5a77a"></i>Wallstudio öffnen</a><button class="nav" id="logout"><i></i>Abmelden</button>';
 go(location.hash.slice(1)||'dashboard');loadUsers();loadContent()}
$('#lform').addEventListener('submit',async e=>{e.preventDefault();const c=$('#lcode').value.trim(),p=$('#lpin').value.trim();if(!c||!p){$('#lerr').textContent='Bitte Code und PIN eingeben.';return}
 const b=$('#lgo');b.disabled=true;$('#lerr').textContent='';
 try{const r=await rpc('ws_login',{p_code:c,p_pin:p});
  if(r&&r.ok){if(!r.admin){try{await rpc('ws_logout',{p_token:r.token})}catch(x){}$('#lerr').textContent='Dieser Zugang hat keine Admin-Rechte.'}
   else{ses={token:r.token,name:r.name,admin:true,t:Date.now()};save();$('#lpin').value='';enter()}}
  else $('#lerr').textContent=r&&r.error==='gesperrt'?'Dieser Zugang ist gesperrt.':'Code oder PIN falsch.'}
 catch(x){$('#lerr').textContent='Keine Verbindung zum Server. Bitte Internet prüfen.'}finally{b.disabled=false}});
(async function start(){if(!ses||!ses.token){showLogin('');return}
 try{const r=await rpc('ws_check',{p_token:ses.token});if(r&&r.ok&&r.admin){ses.name=r.name;ses.admin=true;ses.t=Date.now();save();enter()}
  else if(r&&r.ok){ses=null;showLogin('Dieser Zugang hat keine Admin-Rechte. Bitte als Administrator anmelden.')}
  else{ses=null;save();showLogin('Bitte neu anmelden.')}}
 catch(x){showLogin('Keine Verbindung. Der Adminbereich braucht Internet.')}})();
})();
</script></body></html>
